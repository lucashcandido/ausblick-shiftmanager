<style>
/* Ausblick – shift manager. The base for the shift planning of every customer app.
   Same build as ausblick-clientes: one file, data in a private GitHub repository (turnos.json),
   token published encrypted (access.json) and opened with a 12-character code.
   Staff see their own shifts through a separate team repository (plan copy + day-off requests). */
:root{--bg:#f3f4f7;--card:#fff;--text:#171a21;--muted:#667085;--line:#e2e5eb;--accent:#1d4ed8;--accent-soft:#e3ebff;--in:#15803d;--in-soft:#dcf5e4;--out:#c62828;--out-soft:#fde4e4;--warn:#b45309;--warn-soft:#fdeed3;--vio:#7c3aed;--vio-soft:#ede5ff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1218;--card:#191d26;--text:#eef0f4;--muted:#98a2b3;--line:#2a303c;--accent:#6b93ff;--accent-soft:#1d2a4d;--in:#4ade80;--in-soft:#12301f;--out:#f87171;--out-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2a0d;--vio:#b79bff;--vio-soft:#2a1f45}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.top h1{font-size:20px;margin:0;line-height:1.15;min-width:0;flex:1}
.top .sub{display:block;font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;font-size:22px}
.icon.add{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border-radius:14px;padding:0 20px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.go{background:var(--in);color:#fff;border-color:var(--in)}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--card)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.ok{background:var(--in-soft);color:var(--in)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.field{margin-bottom:14px} .field label,.lbl{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field input,.field textarea,.field select,.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2.wrap{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.tabs,.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button,.views button,.seg button,.chips button{border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;padding:8px 10px;font-size:15px}
.views button{padding:10px;font-size:16px}
.tabs button.on,.views button.on,.seg button.on,.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:24px;letter-spacing:.06em;text-align:center;padding:12px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0 12px;user-select:all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{padding:6px 12px;border-radius:999px;font-size:14px}
.chips button i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)} .pill.err,.pill.wait{cursor:pointer;text-decoration:underline dotted}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--in)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--out)}
.empty{color:var(--muted);padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* avatars: initials in a colour that belongs to the person */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none;background:var(--avb);color:var(--avt);letter-spacing:.02em}
.av.sm{width:24px;height:24px;font-size:10px}
.av.open{background:var(--warn-soft);color:var(--warn);border:1.5px dashed var(--warn)}
/* week navigation (stays at the top while scrolling) */
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 2px;margin:0 -16px;padding-left:16px;padding-right:16px}
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.weekbar .wk{flex:1;text-align:center;font-weight:750;font-size:17px;min-width:0}
.weekbar .wk small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.strip button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:5px 0 6px;cursor:pointer;text-align:center;line-height:1.15}
.strip button small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.strip button b{font-size:16px}
.strip button i{display:block;height:4px;border-radius:2px;margin:5px 7px 0;background:var(--line)}
.strip button.ok i{background:var(--in)} .strip button.w i{background:var(--warn)} .strip button.e i{background:var(--out)}
.strip button.today{border-color:var(--accent)} .strip button.today b{color:var(--accent)}
.strip button.sel{background:var(--accent-soft);border-color:var(--accent)}
.strip button.past{opacity:.55}
.strip button.closed{border-style:dashed;background:var(--bg)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools select{flex:1 1 160px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;min-width:0}
.seg{display:flex;gap:4px;flex:none} .seg button{padding:8px 12px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stat{font-size:14px;font-weight:650;border-radius:999px;padding:4px 12px;background:var(--card);border:1px solid var(--line)}
.stat.w{background:var(--warn-soft);color:var(--warn);border-color:transparent;cursor:pointer} .stat.e{background:var(--out-soft);color:var(--out);border-color:transparent;cursor:pointer}
.stat.v{background:var(--vio-soft);color:var(--vio);border-color:transparent;cursor:pointer}
.stat.on{outline:2px solid currentColor}
/* day view */
.days{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;scroll-margin-top:150px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.past{opacity:.62}
.dh{display:flex;align-items:center;gap:8px}
.dh b{flex:1;font-size:16px} .dh span{color:var(--muted);font-size:13px}
.dh b small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px;white-space:nowrap}
.dh button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:20px;line-height:1;flex:none}
.shl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.sh{border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sh:hover{border-color:var(--accent)}
.sh.bad{border-color:var(--out)}
.sh.open{border:1.5px dashed var(--warn)}
.sh .who{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:650}
.sh .who small{display:block;color:var(--muted);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.sh .who .ow{color:var(--warn)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--c,var(--vio));background:color-mix(in srgb,var(--c,var(--vio)) 14%,transparent);border-radius:6px;padding:1px 7px;white-space:nowrap}
.sh .tag{flex:none;align-self:flex-start}
.wn{display:block;font-size:13px;font-weight:650;color:var(--out)}
.wn.y{color:var(--warn)}
.offl{font-size:14px;color:var(--muted);margin-top:6px} .offl b{font-weight:650}
.offl .wsh{color:var(--vio)}
.none{color:var(--muted);font-size:14px;margin:6px 0 0}
/* timeline view */
.line{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.lh{display:flex;align-items:center;gap:8px;margin-bottom:10px} .lh b{flex:1} .lh span{color:var(--muted);font-size:13px}
.axis,.lrow,.cov{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center}
@media (min-width:700px){.axis,.lrow,.cov{grid-template-columns:150px 1fr}.gaps{margin-left:158px!important}.hleg{margin-left:158px}}
.axis div:last-child{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lrow{margin-top:6px}
.lname{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:650;min-width:0} .lname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:34px;border-radius:8px;background:var(--bg);cursor:pointer;isolation:isolate;overflow:hidden}
.track::after{content:"";position:absolute;inset:0;background-image:linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:var(--gs,25%) 100%;pointer-events:none;z-index:1}
.track .zone{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.zone.pp,.hband .pp,.hleg .pp{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 18%,var(--card)) 0 5px,var(--card) 5px 10px)}
.zone.op,.hband .op,.hleg .op{background:color-mix(in srgb,var(--in) 11%,var(--card))}
.hband{position:relative;height:10px;border-radius:5px;background:var(--bg);overflow:hidden} .hband i{position:absolute;top:0;bottom:0}
.hleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 0 84px} .hleg i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.track.off{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,var(--line) 6px,var(--line) 8px)}
.track.wish{outline:1.5px dashed var(--vio)}
.track .offt{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.bar{position:absolute;z-index:2;top:4px;bottom:4px;border-radius:6px;background:color-mix(in srgb,var(--c,var(--accent)) 30%,var(--card));border:1.5px solid var(--c,var(--accent));font-size:12px;font-weight:700;padding:0 4px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;cursor:pointer;font-variant-numeric:tabular-nums}
.bar.bad{outline:2px solid var(--out);outline-offset:1px}
.bar.cl{border-left-style:dashed;border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-right-style:dashed;border-top-right-radius:0;border-bottom-right-radius:0}
.lrow.openrow .track{outline:1.5px dashed var(--warn)}
.cov{margin-top:12px} .cov .lname{font-size:12px;color:var(--muted);font-weight:600}
.covbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg)}
.covbar i{display:block;height:100%}
.covbar .g{background:var(--in)} .covbar .r{background:var(--out)} .covbar .a{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.gaps{margin:8px 0 0 84px;font-size:13px;color:var(--out);font-weight:650}
/* table view */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.grid th{font-size:13px;color:var(--muted);font-weight:700;background:var(--bg);white-space:nowrap}
.grid th.today{color:var(--accent)}
.grid th small{display:block;font-weight:500;font-size:12px}
.grid th.past,.grid td.past{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:130px;font-weight:700}
.grid td:first-child .nm{display:flex;align-items:center;gap:6px}
.grid th:first-child{background:var(--bg)}
.grid td.cell{cursor:pointer;min-width:92px;height:52px}
.grid td.cell:hover,.grid td.cell.drop{background:var(--accent-soft)}
.grid td.sum{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid td.sum.over{color:var(--out)}
.cs{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);border-radius:0 6px 6px 0;padding:3px 6px;margin-bottom:3px;cursor:pointer;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cs[draggable=true]{cursor:grab}
.cs small{display:block;font-weight:500;color:var(--muted)}
.cs.bad{outline:2px solid var(--out)}
.offc{display:block;font-size:12px;font-weight:700;color:var(--muted);background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,transparent 6px,transparent 12px);border-radius:6px;padding:3px 6px;margin-bottom:3px}
.offc.wsh{color:var(--vio);background:var(--vio-soft)}
.grid tr.openrow td:first-child{color:var(--warn)}
/* people */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.ih{display:flex;align-items:center;gap:12px}
.iname{flex:1;min-width:0;font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.iname .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hrs{flex:none;font-weight:750;font-variant-numeric:tabular-nums;text-align:right}
.hrs small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.hrs.over{color:var(--out)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:15px;color:var(--muted);padding-left:44px}
.meta a{text-decoration:none}
.meta .plus{color:var(--in);font-weight:650} .meta .minus{color:var(--warn);font-weight:650}
/* windows */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.row2{display:flex;gap:10px;flex-wrap:wrap} .row2 .btn{flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.quick button{border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:0 10px 10px 0;background:var(--card);padding:6px 10px;cursor:pointer;font-size:14px;font-weight:700}
.quick button small{font-weight:500;color:var(--muted);margin-left:4px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd button{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:8px 0;font-weight:700;cursor:pointer;font-size:14px}
.wd button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wd button:disabled{opacity:.35;cursor:default}
.rows{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.rows li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;flex-wrap:wrap}
.rows li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rows li small{color:var(--muted)}
.x{border:0;background:none;color:var(--out);font-size:20px;cursor:pointer;width:34px;height:34px;border-radius:8px;flex:none}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--c);cursor:pointer;flex:none}
.addrow{display:flex;gap:8px;flex-wrap:wrap} .addrow .inp{flex:1 1 140px;min-width:0;width:auto} .addrow input[type=time]{flex:0 0 110px}
.hday{display:flex;align-items:center;gap:8px;min-width:76px;cursor:pointer;font-size:15px} .hday input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.rows li input[type=time].inp{flex:1 1 112px;min-width:0;max-width:160px;width:auto;padding:8px 10px;font-size:16px}
.rows li small[data-hn]{flex-basis:100%;padding-left:84px;margin-top:-2px} @media (min-width:600px){.rows li small[data-hn]{flex-basis:auto;padding-left:0;margin-top:0}}
.addrow select.inp{flex:0 1 150px} .addrow input[type=number]{flex:0 0 80px}
.acct{display:flex;align-items:center;gap:8px;margin-bottom:6px} .acct b{flex:1;text-align:center}
.acct button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.acctv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center} .acctv div{background:var(--bg);border-radius:10px;padding:8px 4px;font-size:13px;color:var(--muted)} .acctv b{display:block;font-size:18px;color:var(--text)}
.acctv .plus b{color:var(--in)} .acctv .minus b{color:var(--warn)}
.badge{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.b-p{background:var(--vio-soft);color:var(--vio)} .b-ok{background:var(--in-soft);color:var(--in)} .b-no{background:var(--out-soft);color:var(--out)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171a21;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:16px}
.toast button{background:none;border:0;color:#9db8ff;font-weight:700;cursor:pointer;font-size:16px}
.req{color:var(--out)}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lang.big{margin-bottom:6px} .lang.big button{flex:1;padding:10px;font-size:15px}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.presets button{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-weight:700;cursor:pointer;text-align:left}
.presets button small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.presets button:hover{border-color:var(--accent)}
.dhint{color:var(--muted);font-size:13px;margin:8px 2px 0}
@media (hover:none){.dhint{display:none}}
.printhead{display:none}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:12px}
  main{max-width:none;padding:0}
  .top,.tools,.stick,.stats,#views,#bottom,.toast,#layer,.dhint{display:none!important}
  .printhead{display:block;font-size:18px;font-weight:800;margin-bottom:8px}
  .tblwrap{border:0;overflow:visible}
  table.grid{min-width:0}
  .grid td:first-child,.grid th:first-child{position:static}
  .cs,.av{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>
<main>
  <!-- set-up (once per device) -->
  <section id="setup" hidden>
    <div class="top"><div class="logo">A</div><h1>Ausblick – <span data-t="title"></span><span class="sub" data-t="setup_sub"></span></h1><div class="lang" id="langTop"></div></div>
    <div class="card">
      <div class="tabs"><button type="button" data-mode="code" class="on" data-t="tab_code"></button><button type="button" data-mode="token" data-t="tab_token"></button></div>
      <div class="field"><label for="sName" data-t="name"></label><input id="sName" autocomplete="given-name" placeholder="Lucas"><p class="hint" data-t="name_hint"></p></div>
      <div id="mCode">
        <div class="field"><label for="sCode" data-t="code"></label><input id="sCode" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"><p class="hint" data-t="code_hint"></p></div>
      </div>
      <div id="mToken" hidden>
        <div class="field"><label for="sToken" data-t="token"></label><input id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><p class="hint" data-th="token_hint"></p></div>
        <div class="field"><label for="sRepo" data-t="repo"></label><input id="sRepo" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="sTeam" data-t="team"></label><input id="sTeam" autocomplete="off" spellcheck="false"><p class="hint" data-t="team_hint"></p></div>
      </div>
      <button class="btn primary wide" id="sGo" type="button" data-t="go"></button>
      <button class="btn wide" id="sBack" type="button" hidden style="margin-top:10px" data-t="back"></button>
      <div id="sMsg"></div>
    </div>
  </section>

  <!-- the plan (manager) -->
  <section id="app" hidden>
    <div class="top">
      <div class="logo">A</div>
      <h1><span id="bizName"></span><span class="sub"><span class="pill" data-sync><i></i><span>—</span></span></span></h1>
      <button class="icon add" id="add" type="button" data-ta="new_shift"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="gear" type="button" data-ta="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="views" id="views"></div>
    <div id="planView">
      <div class="stick">
        <div class="weekbar">
          <button class="icon" id="prev" type="button" data-ta="prev_week">‹</button>
          <div class="wk" id="wk"></div>
          <button class="icon" id="next" type="button" data-ta="next_week">›</button>
        </div>
        <div class="strip" id="strip"></div>
      </div>
      <div class="tools">
        <select id="who" data-ta="show"></select>
        <div class="seg" id="mode"></div>
        <button class="btn small" id="today" type="button" data-t="today_btn"></button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="printhead" id="printhead"></div>
      <div id="plan"></div>
      <div id="bottom" class="row2" style="margin-top:14px"></div>
    </div>
    <div id="peopleView" hidden>
      <button class="btn primary wide" id="addEmp" type="button" style="margin-bottom:12px" data-t="new_emp"></button>
      <ul class="list" id="people"></ul>
    </div>
  </section>

  <!-- my shifts (staff) -->
  <section id="staff" hidden>
    <div class="top">
      <div class="logo">A</div>
      <h1><span id="stTitle"></span><span class="sub"><span class="pill" data-sync><i></i><span>—</span></span></span></h1>
      <button class="icon" id="stGear" type="button" data-ta="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="stick">
      <div class="weekbar">
        <button class="icon" id="stPrev" type="button" data-ta="prev_week">‹</button>
        <div class="wk" id="stWk"></div>
        <button class="icon" id="stNext" type="button" data-ta="next_week">›</button>
      </div>
    </div>
    <div id="stBody"></div>
  </section>
</main>

var AVC = [['#dbeafe', '#1e3a8a'], ['#dcfce7', '#14532d'], ['#fef3c7', '#78350f'], ['#f3e8ff', '#581c87'], ['#ffe4e6', '#881337'], ['#cffafe', '#164e63'], ['#fce7f3', '#831843'], ['#ecfccb', '#365314'], ['#e0e7ff', '#312e81'], ['#ffedd5', '#7c2d12']];

var lang = store.get(KEY.lang, null);
if(!TX[lang]){ var nl = String(navigator.language || '').slice(0, 2).toLowerCase(); lang = TX[nl] ? nl : 'es'; }
function t(k){ var s = TX[lang][k], a = arguments; if(s == null) s = TX.es[k]; return String(s).replace(/\{(\d)\}/g, function(m, i){ return a[+i + 1] == null ? '' : a[+i + 1]; }); }
function th(k){ var a = [k]; for(var i = 1; i < arguments.length; i++) a.push(esc(arguments[i])); return t.apply(null, a); }
function langButtons(cur){ return LANGS.map(function(l){ return '<button type="button" data-lang="' + l[0] + '"' + (l[0] === cur ? ' class="on"' : '') + ' title="' + l[1] + '">' + (this.big ? l[1] : l[0].toUpperCase()) + '</button>'; }, this || {}).join(''); }
function applyLang(){
  document.documentElement.lang = lang;

var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
var pad = function(n){ return (n < 10 ? '0' : '') + n; };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
var iso = function(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); };
var todayIso = function(){ return iso(new Date()); };
var hm = function(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
var hhmm = function(m){ m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
var digits = function(v){ return String(v || '').replace(/\D/g, ''); };
var telHref = function(v){ var s = String(v || '').trim(); return s ? 'tel:' + (s.charAt(0) === '+' ? '+' : '') + digits(s) : ''; };
var waNum = function(v){ var d = digits(v); if(d.length < 8) return ''; if(String(v).trim().charAt(0) !== '+' && d.indexOf('54') !== 0) d = '549' + d.replace(/^0/, ''); return d; };
var norm = function(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
var copy = function(x){ return JSON.parse(JSON.stringify(x)); };

/* ---------- days and times ----------
   A day is a number (days since 1970, UTC), so weeks and overnight shifts are plain arithmetic.
   A shift is {d:'2026-11-04', a:'22:00', b:'06:00'}: an end at or before the start means it ends the next day.
   span() gives minutes since 1970 for start and end. */
var dayNum = function(s){ var p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); };
var numIso = function(n){ var d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
var numDate = function(n){ var d = new Date(n * 864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12); };
var dow = function(n){ return new Date(n * 864e5).getUTCDay(); };
var mins = function(s){ var m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
var dur = function(x){ var a = mins(x.a), b = mins(x.b); return isNaN(a) || isNaN(b) ? 0 : ((b - a) + 1440) % 1440 || 1440; };
var overnight = function(x){ return mins(x.b) <= mins(x.a); };
var span = function(x){ var s = dayNum(x.d) * 1440 + mins(x.a); return [s, s + dur(x)]; };
var hrs = function(m){ return (m / 60).toLocaleString(t('locale'), { maximumFractionDigits: 1 }); };
var signed = function(m){ return (m > 0 ? '+' : m < 0 ? '−' : '±') + hrs(Math.abs(m)); };
var fmtDay = function(n, o){ return numDate(n).toLocaleDateString(t('locale'), o || { weekday: 'short', day: 'numeric', month: 'short' }); };
var isoWeek = function(n){ var d = new Date(n * 864e5), wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd + 3); var y = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - y) / 864e5 - 3 + ((y.getUTCDay() + 6) % 7)) / 7); };
var initials = function(n){ var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase(); };
var avColor = function(id){ var h = 0; String(id).split('').forEach(function(c){ h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return AVC[h % AVC.length]; };
var avatar = function(id, name, cls){ if(!id) return '<span class="av open ' + (cls || '') + '">?</span>'; var c = avColor(id); return '<span class="av ' + (cls || '') + '" style="--avb:' + c[0] + ';--avt:' + c[1] + '" aria-hidden="true">' + esc(initials(name)) + '</span>'; };

/* ---------- data ----------
   Everything lives in one map, id -> record, each record with a kind:
   emp  {n, tel, pos:[ids], h, notas}        people
   pos  {n, col, o}                          roles / areas (cashier, kitchen…)
   tpl  {n, a, b, pos}                       typical shifts, to add with one tap
   need {pos, days:[0–6], a, b, n}           minimum staffing (0 = Sunday, like getDay)
   sh   {d, a, b, pos, emp, note, by}        shifts (emp '' = unassigned)
   off  {emp, from, to, kind, note}          absences (vac, sick, off)
   set  {biz, ws, rest, hours, pre, post}    settings (one record, id 'set'); hours = {0–6: {o, c}}, missing day = closed
   Every record has t (last change) and del (deleted); the newer change wins when two devices meet.

async function openAccess(code, url){

/* the whole week as one message for the team group */

/* the person's week as a message: one line per shift */

    '<button class="btn primary wide" id="stWish" type="button" style="margin-top:14px">' + esc(t('wish_btn')) + '</button>' +
    (my.length ? '<h3 style="margin:18px 0 8px;font-size:17px">' + esc(t('my_wishes')) + '</h3><ul class="rows">' + my.map(function(w){
      return '<li><span class="grow"><b>' + esc(wishDates(w)) + '</b>' + (w.note ? ' <small>' + esc(w.note) + '</small>' : '') + '</span><span class="badge ' + (w.st === 'ok' ? 'b-ok' : w.st === 'no' ? 'b-no' : 'b-p') + '">' + esc(t(w.st === 'ok' ? 'w_ok' : w.st === 'no' ? 'w_no' : 'w_p')) + '</span>' +
        (!w.st ? '<button class="btn small" type="button" data-wdel="' + esc(w.id) + '">' + esc(t('wish_cancel')) + '</button>' : '') + '</li>';
    }).join('') + '</ul>' : '');
}
$('#stBody').addEventListener('click', function(e){
  var me = e.target.closest('[data-me]'); if(me){ cfg.emp = me.dataset.me; store.set(KEY.cfg, cfg); window.scrollTo(0, 0); render(); return; }

  if(e.target.closest('#stWish')){

      '<div class="field"><label for="wN">' + esc(t('wish_note')) + '</label><input id="wN" autocomplete="off"></div><div id="wMsg"></div>' +

        if(to < f){ var s = f; f = to; to = s; }
        close(el); touchWishes([{ id: uid(), emp: cfg.emp, from: f, to: to, note: $('#wN', el).value.trim(), st: '', by: cfg.name }]); toast(t('wish_sent'));
      };

  }
});
$('#stPrev').onclick = function(){ goWeek(-1); };
$('#stNext').onclick = function(){ goWeek(1); };
$('#stGear').onclick = function(){
  modal('<h3>' + esc(t('settings')) + '</h3><p>' + th('dev_of', cfg.name) + '</p><span class="lbl">' + esc(t('language')) + '</span><div class="lang big">' + langButtons.call({ big: true }, lang) + '</div>' +
    '<div style="display:grid;gap:8px;margin-top:14px"><button class="btn" id="gWho" type="button">' + esc(t('g_who')) + '</button><button class="btn" id="gSync2" type="button">' + esc(t('g_sync')) + '</button><button class="btn" id="gSetup2" type="button">' + esc(t('g_setup')) + '</button><button class="btn primary" data-close type="button">' + esc(t('close')) + '</button></div>', function(el){
    $('.lang', el).addEventListener('click', function(e){ if(e.target.closest('[data-lang]')) setTimeout(function(){ close(el); $('#stGear').click(); }); });
    $('#gWho', el).onclick = function(){ close(el); cfg.emp = ''; store.set(KEY.cfg, cfg); render(); };
    $('#gSync2', el).onclick = function(){ close(el); syncNow(); };
    $('#gSetup2', el).onclick = function(){ close(el); openSetup(); };
  });
};

/* ---------- small windows ---------- */
function modal(html, init){
  var ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  ov.addEventListener('click', function(e){ if(e.target === ov || e.target.closest('[data-close]')) close(ov); });
  $('#layer').appendChild(ov); if(init) init(ov); return ov;
}
function close(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ var o = $('#layer .ov:last-child'); if(o) close(o); } });
var toastT = 0;
function toast(text, act, fn){
  var old = $('.toast'); if(old) close(old);
  var el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button type="button">' + esc(act) + '</button>' : '');
  if(act) el.querySelector('button').onclick = function(){ close(el); fn(); };
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(function(){ close(el); }, 6000);
}

/* ---------- saving to GitHub ----------
   Each file is {v:1, c:{id → record}}; saving re-reads the file, merges (newer change wins per record) and writes. */
function touchMany(list){
  if(!list.length) return;
  var now = Date.now();
  list.forEach(function(x){ x.t = now; data[x.id] = x; });
  dirty = true; store.set(KEY.data, data); store.set(KEY.dirty, dirty); render(); syncSoon();
}
function touchWishes(list){
  var now = Date.now();
  list.forEach(function(x){ x.t = now; wish[x.id] = x; });
  dirtyW = true; store.set(KEY.wish, wish); store.set(KEY.dirtyW, dirtyW); render(); syncSoon();
}
function setSync(st, k, arg){ sync.label = [st, k, arg]; $$('[data-sync]').forEach(function(p){ p.className = 'pill ' + st; p.lastChild.textContent = k === '…' ? '…' : t(k, arg); }); }
document.addEventListener('click', function(e){
  var p = e.target.closest('[data-sync]'); if(!p) return;
  if(!sync.err || !/err|wait/.test(p.className)) return;
  modal('<h3>' + esc(t('err_title')) + '</h3><p style="overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:14px">' + esc(sync.err.detail) + '</p>' + (/^PUT 403/.test(sync.err.detail) ? '<div class="msg warn">' + esc(t('err_write')) + '</div>' : '') + '<p class="hint">' + esc(new Date(sync.err.at).toLocaleString(t('locale'))) + ' · navigator.onLine=' + sync.err.online + '</p><div class="row2"><button class="btn" data-close type="button">' + esc(t('close')) + '</button><button class="btn primary" id="errRetry" type="button">' + esc(t('err_retry')) + '</button></div>', function(el){ $('#errRetry', el).onclick = function(){ close(el); syncNow(); }; });
});
function syncSoon(){ clearTimeout(sync.timer); setSync('wait', 's_saving'); sync.timer = setTimeout(syncNow, 1200); }
function api(repo, file, opt){
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, opt.headers || {}); opt.cache = 'no-store';
  return fetch('https://api.github.com/repos/' + repo + '/contents/' + file, opt);
}
function merge(map, remote){
  var changed = false;
  Object.keys(remote || {}).forEach(function(id){
    var r = remote[id], l = map[id];
    if(!r) return;
    if(!l || (r.t || 0) > (l.t || 0)){ map[id] = r; changed = true; }
  });
  return changed;
}
async function httpErr(r, what){
  var m = ''; try{ var j = await r.clone().json(); m = j.message || ''; if(j.errors) m += ' ' + JSON.stringify(j.errors); }catch(e){ try{ m = (await r.text()).slice(0, 200); }catch(x){} }
  var e = new Error('http ' + r.status); e.status = r.status; e.detail = what + ' ' + r.status + (m ? ': ' + m : ''); return e;
}
async function load(repo, file){
  var r = await api(repo, file);
  if(r.status === 404) return { sha: null, o: null };
  if(!r.ok) throw await httpErr(r, 'GET ' + file);
  var j = await r.json(), txt = j.content ? b64d(j.content) : '';
  if(!txt && j.size){ var rr = await api(repo, file, { headers: { Accept: 'application/vnd.github.raw' } }); if(!rr.ok) throw await httpErr(rr, 'GET raw ' + file); txt = await rr.text(); }
  return { sha: j.sha, o: JSON.parse(txt || '{}') };
}
async function put(repo, file, obj, sha){
  var body = { message: cfg.name + ' ' + new Date().toISOString(), content: b64e(JSON.stringify(obj) + '\n') };
  if(sha) body.sha = sha;
  return api(repo, file, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}
/* read, merge, write; on a clash with another device, again */
async function saveMap(repo, file, map){
  var last;
  for(var tries = 0; tries < 3; tries++){
    var cur = await load(repo, file); merge(map, cur.o && cur.o.c);
    var r = await put(repo, file, { v: 1, c: map }, cur.sha);
    if(r.ok) return;
    last = await httpErr(r, 'PUT ' + file);
    if(r.status !== 409 && r.status !== 422) throw last;
  }
  throw last;
}
async function pullMap(repo, file, map){ var cur = await load(repo, file); merge(map, cur.o && cur.o.c); }
/* the copy for the staff: names, roles and shifts from a week back to three months ahead; no phones, notes about people or absence reasons */
function publicPlan(){
  var from = numIso(dayNum(todayIso()) - 7), to = numIso(dayNum(todayIso()) + 92), s = settings(), out = { v: 1, biz: s.biz, ws: s.ws, emp: {}, pos: {}, sh: [], off: [] };
  emps().forEach(function(e){ out.emp[e.id] = { n: e.n }; });
  poses().forEach(function(p){ out.pos[p.id] = { n: p.n, col: p.col }; });
  sortShifts(live('sh').filter(function(x){ return x.d >= from && x.d <= to; })).forEach(function(x){ out.sh.push({ d: x.d, a: x.a, b: x.b, pos: x.pos || '', emp: x.emp && rec(x.emp) ? x.emp : '', note: x.note || '' }); });
  live('off').filter(function(o){ return o.to >= from && rec(o.emp); }).forEach(function(o){ out.off.push({ emp: o.emp, from: o.from, to: o.to }); });
  return out;
}
async function publish(){
  var obj = publicPlan(), h = JSON.stringify(obj);
  if(h === store.get(KEY.pub, '')) return;
  for(var tries = 0; tries < 3; tries++){
    var r0 = await api(cfg.team, 'plan.json'), sha = null;
    if(r0.ok) sha = (await r0.json()).sha; else if(r0.status !== 404) throw await httpErr(r0, 'GET plan.json');
    var r = await put(cfg.team, 'plan.json', obj, sha);
    if(r.ok){ store.set(KEY.pub, h); return; }
    if(r.status !== 409 && r.status !== 422) throw await httpErr(r, 'PUT plan.json');
  }
}
async function syncWishes(){
  if(dirtyW){ dirtyW = false; store.set(KEY.dirtyW, false); try{ await saveMap(cfg.team, 'wishes.json', wish); }catch(e){ dirtyW = true; store.set(KEY.dirtyW, true); throw e; } }
  else await pullMap(cfg.team, 'wishes.json', wish);
  store.set(KEY.wish, wish);
}
async function syncNow(){
  if(!cfg) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; clearTimeout(sync.timer);
  try{
    if(isStaff()){
      var p = await load(cfg.team, 'plan.json'); sync.loadedPlan = true;
      if(p.o){ plan = p.o; store.set(KEY.plan, plan); }
      await syncWishes();
    } else {
      if(dirty){ dirty = false; store.set(KEY.dirty, dirty); try{ await saveMap(cfg.repo, APP.file, data); }catch(e){ dirty = true; store.set(KEY.dirty, dirty); throw e; } }
      else await pullMap(cfg.repo, APP.file, data);
      store.set(KEY.data, data);
      if(cfg.team){ await syncWishes(); await publish(); }
    }
    sync.err = null; setSync('ok', 's_saved', hm(Date.now()));
  }catch(e){
    if(/http 401/.test(e.message)){
      var fresh = null; try{ fresh = await openAccess(cfg.code, isStaff() ? STAFF_URL : ACCESS_URL); }catch(x){}
      if(fresh && fresh.token !== cfg.token){ cfg.token = fresh.token; if(fresh.repo) cfg.repo = fresh.repo; if(fresh.team != null) cfg.team = fresh.team; store.set(KEY.cfg, cfg); sync.busy = false; return syncNow(); }
      setSync('err', 's_expired');
    }
    else {
      var pend = dirty || dirtyW;
      sync.err = { at: Date.now(), detail: e.detail || (e.name + ': ' + e.message), online: navigator.onLine };
      try{ console.error('[ausblick sync]', sync.err.detail, e); }catch(x){}
      if(e.status) setSync(pend ? 'wait' : 'err', pend ? 's_later_err' : 's_error', e.status);
      else setSync(pend ? 'wait' : 'err', pend ? 's_later' : 's_offline');
    }
  }
  sync.busy = false;
  /* don't redraw under an open window; it redraws when that window saves */
  if(!$('#layer .ov')) render();
  if(sync.again){ sync.again = false; syncNow(); }
}
setInterval(function(){ if(cfg && document.visibilityState === 'visible') syncNow(); }, 60000);
addEventListener('online', function(){ syncNow(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') syncNow(); });

curWeek = week0(dayNum(todayIso()));
applyLang();
show();
if(cfg){ setSync(dirty || dirtyW ? 'wait' : 'ok', '…'); syncNow(); }
window.__as = { get data(){ return data; }, get wish(){ return wish; }, get cfg(){ return cfg; }, get plan(){ return plan; }, syncNow: syncNow, sealAccess: sealAccess, setLang: setLang, problems: problems, coverage: coverage };
})();
