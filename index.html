<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ausblick Turnos">
<title>Ausblick – Turnos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d4ed8'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
/* Ausblick – shift manager. The base for the shift planning of every customer app.
   Same build as ausblick-clientes: one file, data in a private GitHub repository (turnos.json),
   token published encrypted (access.json) and opened with a 12-character code. */
:root{--bg:#f3f4f7;--card:#fff;--text:#171a21;--muted:#667085;--line:#e2e5eb;--accent:#1d4ed8;--accent-soft:#e3ebff;--in:#15803d;--in-soft:#dcf5e4;--out:#c62828;--out-soft:#fde4e4;--warn:#b45309;--warn-soft:#fdeed3;--vio:#7c3aed;--vio-soft:#ede5ff}
@media (prefers-color-scheme: dark){:root{--bg:#0f1218;--card:#191d26;--text:#eef0f4;--muted:#98a2b3;--line:#2a303c;--accent:#6b93ff;--accent-soft:#1d2a4d;--in:#4ade80;--in-soft:#12301f;--out:#f87171;--out-soft:#3a1a1a;--warn:#fbbf24;--warn-soft:#3a2a0d;--vio:#b79bff;--vio-soft:#2a1f45}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:980px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;padding:6px 0 12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;flex:none}
.top h1{font-size:20px;margin:0;line-height:1.15;min-width:0;flex:1}
.top .sub{display:block;font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon.add{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{border-radius:14px;padding:0 20px;min-height:52px;font-size:17px;font-weight:700;cursor:pointer;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.go{background:var(--in);color:#fff;border-color:var(--in)}
.btn.danger{color:var(--out);border-color:var(--out);background:var(--card)}
.btn.small{min-height:40px;padding:0 14px;font-size:15px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}
.msg.err{background:var(--out-soft);color:var(--out)} .msg.ok{background:var(--in-soft);color:var(--in)} .msg.warn{background:var(--warn-soft);color:var(--warn)}
.field{margin-bottom:14px} .field label,.lbl{display:block;font-weight:650;margin-bottom:6px;font-size:15px}
.field input,.field textarea,.field select,.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2.wrap{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.tabs,.views{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button,.views button,.seg button,.chips button{border:2px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;padding:8px 10px;font-size:15px}
.views button{padding:10px;font-size:16px}
.tabs button.on,.views button.on,.seg button.on,.chips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;font-size:24px;letter-spacing:.06em;text-align:center;padding:12px;border:2px dashed var(--accent);border-radius:12px;margin:8px 0 12px;user-select:all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{padding:6px 12px;border-radius:999px;font-size:14px}
.chips button i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)} .pill.err,.pill.wait{cursor:pointer;text-decoration:underline dotted}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill.ok i{background:var(--in)} .pill.wait i{background:var(--warn)} .pill.err i{background:var(--out)}
.empty{color:var(--muted);padding:14px 16px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
/* week navigation and toolbar */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.weekbar .wk{flex:1;text-align:center;font-weight:750;font-size:17px;min-width:0}
.weekbar .wk small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools select{flex:1 1 160px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;min-width:0}
.seg{display:flex;gap:4px;flex:none} .seg button{padding:8px 12px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stat{font-size:14px;font-weight:650;border-radius:999px;padding:4px 12px;background:var(--card);border:1px solid var(--line)}
.stat.w{background:var(--warn-soft);color:var(--warn);border-color:transparent;cursor:pointer} .stat.e{background:var(--out-soft);color:var(--out);border-color:transparent;cursor:pointer}
/* day view */
.days{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.dh{display:flex;align-items:center;gap:8px}
.dh b{flex:1;font-size:16px} .dh span{color:var(--muted);font-size:13px}
.dh button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:20px;line-height:1;flex:none}
.shl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.sh{border:1px solid var(--line);border-left:5px solid var(--c,var(--accent));border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.sh:hover{border-color:var(--accent);border-left-color:var(--c,var(--accent))}
.sh .tm{font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.sh .tm small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.sh .who{flex:1;min-width:0;overflow-wrap:anywhere}
.sh .who small{display:block;color:var(--muted);font-size:13px}
.open{color:var(--warn);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--c,var(--vio));background:color-mix(in srgb,var(--c,var(--vio)) 14%,transparent);border-radius:6px;padding:1px 7px}
.wn{display:block;font-size:13px;font-weight:650;color:var(--out)}
.offl{font-size:14px;color:var(--muted);margin-top:6px} .offl b{font-weight:650}
.none{color:var(--muted);font-size:14px;margin:6px 0 0}
/* table view */
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.grid th{font-size:13px;color:var(--muted);font-weight:700;background:var(--bg);white-space:nowrap}
.grid th.today{color:var(--accent)}
.grid td:first-child,.grid th:first-child{position:sticky;left:0;background:var(--card);z-index:1;min-width:120px;font-weight:700}
.grid th:first-child{background:var(--bg)}
.grid td.cell{cursor:pointer;min-width:92px;height:52px}
.grid td.cell:hover{background:var(--accent-soft)}
.grid td.sum{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid td.sum.over{color:var(--out)}
.cs{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent);border-radius:6px;padding:3px 6px;margin-bottom:3px;cursor:pointer;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cs small{display:block;font-weight:500;color:var(--muted)}
.cs.bad{outline:2px solid var(--out)}
.offc{display:block;font-size:12px;font-weight:700;color:var(--muted);background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 6px,transparent 6px,transparent 12px);border-radius:6px;padding:3px 6px}
.grid tr.openrow td:first-child{color:var(--warn)}
/* people */
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.ih{display:flex;align-items:flex-start;gap:10px}
.iname{flex:1;min-width:0;font-weight:700;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.iname .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.hrs{flex:none;font-weight:750;font-variant-numeric:tabular-nums;text-align:right}
.hrs small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.hrs.over{color:var(--out)}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:15px;color:var(--muted)}
.meta a{text-decoration:none}
/* windows */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.row2{display:flex;gap:10px;flex-wrap:wrap} .row2 .btn{flex:1}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.quick button{border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:10px;background:var(--card);padding:6px 10px;cursor:pointer;font-size:14px;font-weight:700}
.quick button small{font-weight:500;color:var(--muted);margin-left:4px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd button{border:2px solid var(--line);border-radius:10px;background:var(--card);padding:8px 0;font-weight:700;cursor:pointer;font-size:14px}
.wd button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wd button:disabled{opacity:.35;cursor:default}
.rows{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.rows li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.rows li .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rows li small{color:var(--muted)}
.x{border:0;background:none;color:var(--out);font-size:20px;cursor:pointer;width:34px;height:34px;border-radius:8px;flex:none}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--c);cursor:pointer;flex:none}
.addrow{display:flex;gap:8px;flex-wrap:wrap} .addrow .inp{flex:1 1 140px;min-width:0;width:auto} .addrow input[type=time]{flex:0 0 110px}
.addrow select.inp{flex:0 1 150px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#171a21;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;z-index:60;width:max-content;max-width:calc(100% - 32px);font-size:16px}
.toast button{background:none;border:0;color:#9db8ff;font-weight:700;cursor:pointer;font-size:16px}
.req{color:var(--out)}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lang.big{margin-bottom:6px} .lang.big button{flex:1;padding:10px;font-size:15px}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.presets button{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-weight:700;cursor:pointer;text-align:left}
.presets button small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.presets button:hover{border-color:var(--accent)}
.printhead{display:none}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:12px}
  main{max-width:none;padding:0}
  .top,.tools,.weekbar,.stats,#views,#bottom,.toast,#layer{display:none!important}
  .printhead{display:block;font-size:18px;font-weight:800;margin-bottom:8px}
  .tblwrap{border:0;overflow:visible}
  table.grid{min-width:0}
  .grid td:first-child,.grid th:first-child{position:static}
  .cs{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>
<main>
  <!-- set-up (once per device) -->
  <section id="setup" hidden>
    <div class="top"><div class="logo">A</div><h1>Ausblick – <span data-t="title"></span><span class="sub" data-t="setup_sub"></span></h1><div class="lang" id="langTop"></div></div>
    <div class="card">
      <div class="tabs"><button type="button" data-mode="code" class="on" data-t="tab_code"></button><button type="button" data-mode="token" data-t="tab_token"></button></div>
      <div class="field"><label for="sName" data-t="name"></label><input id="sName" autocomplete="given-name" placeholder="Lucas"><p class="hint" data-t="name_hint"></p></div>
      <div id="mCode">
        <div class="field"><label for="sCode" data-t="code"></label><input id="sCode" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX"><p class="hint" data-t="code_hint"></p></div>
      </div>
      <div id="mToken" hidden>
        <div class="field"><label for="sToken" data-t="token"></label><input id="sToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"><p class="hint" data-th="token_hint"></p></div>
        <div class="field"><label for="sRepo" data-t="repo"></label><input id="sRepo" autocomplete="off" spellcheck="false"></div>
      </div>
      <button class="btn primary wide" id="sGo" type="button" data-t="go"></button>
      <button class="btn wide" id="sBack" type="button" hidden style="margin-top:10px" data-t="back"></button>
      <div id="sMsg"></div>
    </div>
  </section>

  <!-- the plan -->
  <section id="app" hidden>
    <div class="top">
      <div class="logo">A</div>
      <h1><span id="bizName"></span><span class="sub"><span class="pill" id="sync"><i></i><span>—</span></span></span></h1>
      <button class="icon add" id="add" type="button" data-ta="new_shift"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="gear" type="button" data-ta="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div class="views" id="views"></div>
    <div id="planView">
      <div class="weekbar">
        <button class="icon" id="prev" type="button" data-ta="prev_week">‹</button>
        <div class="wk" id="wk"></div>
        <button class="icon" id="next" type="button" data-ta="next_week">›</button>
      </div>
      <div class="tools">
        <select id="who" data-ta="show"></select>
        <div class="seg" id="mode"></div>
        <button class="btn small" id="today" type="button" data-t="today_btn"></button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="printhead" id="printhead"></div>
      <div id="plan"></div>
      <div id="bottom" class="row2" style="margin-top:14px"></div>
    </div>
    <div id="peopleView" hidden>
      <button class="btn primary wide" id="addEmp" type="button" style="margin-bottom:12px" data-t="new_emp"></button>
      <ul class="list" id="people"></ul>
    </div>
  </section>
</main>
<div id="layer"></div>
<script>

  e_expired:'El token no es válido o venció.', e_norepo:'El token no tiene acceso a {0} (o el repositorio no existe).',

/* ---------- branch models ----------
   Roles and typical shifts per business type, in all three languages. Loading one only adds what is missing. */
var L3 = function(es, en, de){ return { es: es, en: en, de: de }; };
var TN = { m: L3('Mañana', 'Morning', 'Früh'), a: L3('Tarde', 'Afternoon', 'Spät'), n: L3('Noche', 'Night', 'Nacht'), f: L3('Completo', 'Full day', 'Ganztags'), l: L3('Mediodía', 'Lunch', 'Mittag') };
var PRESETS = [
  { id: 'parking', name: L3('Cochera / estacionamiento', 'Parking lot', 'Parkplatz / Garage'), pos: [L3('Playero', 'Attendant', 'Parkwächter'), L3('Caja', 'Cashier', 'Kasse')], tpl: [['m', '06:00', '14:00'], ['a', '14:00', '22:00'], ['n', '22:00', '06:00']] },
  { id: 'hair', name: L3('Peluquería', 'Hairdresser', 'Friseur'), pos: [L3('Estilista', 'Stylist', 'Friseur/in'), L3('Recepción', 'Reception', 'Empfang')], tpl: [['m', '09:00', '14:00'], ['a', '14:00', '20:00'], ['f', '09:00', '18:00']] },
  { id: 'food', name: L3('Gastronomía', 'Restaurant', 'Gastronomie'), pos: [L3('Cocina', 'Kitchen', 'Küche'), L3('Salón', 'Floor', 'Service'), L3('Barra', 'Bar', 'Bar')], tpl: [['l', '11:00', '16:00'], ['n', '19:00', '01:00'], ['f', '11:00', '23:00']] },
  { id: 'retail', name: L3('Comercio', 'Shop', 'Einzelhandel'), pos: [L3('Ventas', 'Sales', 'Verkauf'), L3('Caja', 'Cashier', 'Kasse'), L3('Depósito', 'Stock', 'Lager')], tpl: [['m', '08:00', '14:00'], ['a', '14:00', '20:00']] },
  { id: 'general', name: L3('Otro / general', 'Other / general', 'Sonstige / allgemein'), pos: [L3('Atención', 'Front desk', 'Kundendienst'), L3('Administración', 'Office', 'Verwaltung')], tpl: [['m', '08:00', '14:00'], ['a', '14:00', '20:00']] }
];
var COLORS = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626', '#0891b2', '#db2777', '#65a30d'];

var lang = store.get(KEY.lang, null);
if(!TX[lang]){ var nl = String(navigator.language || '').slice(0, 2).toLowerCase(); lang = TX[nl] ? nl : 'es'; }
function t(k){ var s = TX[lang][k], a = arguments; if(s == null) s = TX.es[k]; return String(s).replace(/\{(\d)\}/g, function(m, i){ return a[+i + 1] == null ? '' : a[+i + 1]; }); }
function th(k){ var a = [k]; for(var i = 1; i < arguments.length; i++) a.push(esc(arguments[i])); return t.apply(null, a); }
function langButtons(cur){ return LANGS.map(function(l){ return '<button type="button" data-lang="' + l[0] + '"' + (l[0] === cur ? ' class="on"' : '') + ' title="' + l[1] + '">' + (this.big ? l[1] : l[0].toUpperCase()) + '</button>'; }, this || {}).join(''); }
function applyLang(){
  document.documentElement.lang = lang;
  [].forEach.call(document.querySelectorAll('[data-t]'), function(el){ el.textContent = t(el.dataset.t); });
  [].forEach.call(document.querySelectorAll('[data-th]'), function(el){ el.innerHTML = t(el.dataset.th); });
  [].forEach.call(document.querySelectorAll('[data-tp]'), function(el){ el.placeholder = t(el.dataset.tp); });
  [].forEach.call(document.querySelectorAll('[data-ta]'), function(el){ el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  $('#langTop').innerHTML = langButtons.call({}, lang);
  if(sync.label) setSync(sync.label[0], sync.label[1], sync.label[2]);
  render();
}
function setLang(l){ if(!TX[l]) return; lang = l; store.set(KEY.lang, l); $('#sMsg').innerHTML = ''; applyLang(); }
document.addEventListener('click', function(e){ var b = e.target.closest('[data-lang]'); if(b){ setLang(b.dataset.lang); [].forEach.call(document.querySelectorAll('[data-lang]'), function(o){ o.classList.toggle('on', o.dataset.lang === lang); }); } });

var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); };
var pad = function(n){ return (n < 10 ? '0' : '') + n; };
var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); };
var iso = function(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); };
var todayIso = function(){ return iso(new Date()); };
var hm = function(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
var digits = function(v){ return String(v || '').replace(/\D/g, ''); };
var telHref = function(v){ var s = String(v || '').trim(); return s ? 'tel:' + (s.charAt(0) === '+' ? '+' : '') + digits(s) : ''; };
var waNum = function(v){ var d = digits(v); if(d.length < 8) return ''; if(String(v).trim().charAt(0) !== '+' && d.indexOf('54') !== 0) d = '549' + d.replace(/^0/, ''); return d; };
var norm = function(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
var copy = function(x){ return JSON.parse(JSON.stringify(x)); };

/* ---------- days and times ----------
   A day is a number (days since 1970, UTC), so weeks and overnight shifts are plain arithmetic.
   A shift is {d:'2026-11-04', a:'22:00', b:'06:00'}: an end at or before the start means it ends the next day. */
var dayNum = function(s){ var p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); };
var numIso = function(n){ var d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
var numDate = function(n){ var d = new Date(n * 864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12); };
var dow = function(n){ return new Date(n * 864e5).getUTCDay(); };
var mins = function(s){ var m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : NaN; };
var dur = function(x){ var a = mins(x.a), b = mins(x.b); return isNaN(a) || isNaN(b) ? 0 : ((b - a) + 1440) % 1440 || 1440; };
var overnight = function(x){ return mins(x.b) <= mins(x.a); };
var span = function(x){ var s = dayNum(x.d) * 1440 + mins(x.a); return [s, s + dur(x)]; };
var hrs = function(m){ return (m / 60).toLocaleString(t('locale'), { maximumFractionDigits: 2 }); };
var fmtDay = function(n, o){ return numDate(n).toLocaleDateString(t('locale'), o || { weekday: 'short', day: 'numeric', month: 'short' }); };
var isoWeek = function(n){ var d = new Date(n * 864e5), wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd + 3); var y = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - y) / 864e5 - 3 + ((y.getUTCDay() + 6) % 7)) / 7); };

/* ---------- data ----------
   Everything lives in one map, id -> record, each record with a kind:
   emp {n, tel, pos:[ids], h, notas}      people
   pos {n, col}                           roles / areas (cashier, kitchen…)
   tpl {n, a, b, pos}                     typical shifts, to add with one tap
   sh  {d, a, b, pos, emp, note, by}      shifts (emp '' = unassigned)
   off {emp, from, to, kind, note}        absences
   set {biz, ws}                          settings (one record, id 'set')
   Every record has t (last change) and del (deleted); the newer change wins when two devices meet. */

/* problems of one shift: double booked, absent, role the person does not have */
function problems(s, pool){
  var out = [];
  if(!s.emp) return out;
  var e = rec(s.emp), sp = span(s), name = empName(s.emp);
  if(pool.some(function(o){ if(o.id === s.id || o.emp !== s.emp) return false; var op = span(o); return op[0] < sp[1] && sp[0] < op[1]; })) out.push(t('w_overlap', name));

}

/* ---------- access code ----------
   access.json (in the public app repository) = AES-GCM(PBKDF2(code)) of {repo, token}.
   Without the code the file is useless. Whoever sets the app up with the token gets the code and the file. */
var cleanCode = function(c){ return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); };
var showCode = function(c){ return cleanCode(c).slice(0, 12).replace(/(.{4})(?=.)/g, '$1-'); };
var b64bytes = function(s){ var x = atob(String(s)), b = new Uint8Array(x.length); for(var i = 0; i < x.length; i++) b[i] = x.charCodeAt(i); return b; };
var bytesb64 = function(b){ var x = ''; b = new Uint8Array(b); for(var i = 0; i < b.length; i++) x += String.fromCharCode(b[i]); return btoa(x); };
var b64e = function(s){ return bytesb64(new TextEncoder().encode(s)); };
var b64d = function(s){ return new TextDecoder().decode(b64bytes(String(s).replace(/\s/g, ''))); };
async function keyFor(code, salt, it, use){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(cleanCode(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, [use]);
}
async function openAccess(code){
  var r = await fetch(ACCESS_URL, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if(r.status === 404) throw new Error('none');
  if(!r.ok) throw new Error('net');
  var j = await r.json(), blob = JSON.parse(b64d(j.content));
  if(!blob || blob.v !== 1 || !(blob.it >= 100000 && blob.it <= 5000000)) throw new Error('format');
  var k = await keyFor(code, b64bytes(blob.salt), blob.it, 'decrypt'), plain;
  try{ plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64bytes(blob.iv) }, k, b64bytes(blob.ct)); }catch(e){ throw new Error('code'); }
  var conf = JSON.parse(new TextDecoder().decode(plain));
  if(!conf || typeof conf.token !== 'string' || !/^[\w.-]+\/[\w.-]+$/.test(conf.repo || '')) throw new Error('format');
  return conf;
}
async function sealAccess(code, repo, token){
  var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), it = 310000;
  var k = await keyFor(code, salt, it, 'encrypt');
  var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify({ repo: repo, token: token })));
  return JSON.stringify({ v: 1, it: it, salt: bytesb64(salt), iv: bytesb64(iv), ct: bytesb64(ct) }, null, 2) + '\n';
}
function newCode(){
  var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(12)), s = '';
  for(var i = 0; i < 12; i++) s += abc[r[i] % abc.length];
  return s;
}
async function checkRepo(repo, token){
  var r = await fetch('https://api.github.com/repos/' + repo, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if(r.status === 401) throw new Error('expired');
  if(r.status === 404 || r.status === 403) throw new Error('norepo');
  if(!r.ok) throw new Error('net');
  var j = await r.json();
  if(j.permissions && !j.permissions.push) throw new Error('readonly');
}
function download(name, text, type){
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); close(a); }, 1000);
}

function applyPreset(id){

/* the person's week as a message: one line per shift */
function scheduleText(e){
  var n0 = curWeek, first = String(e.n).split(' ')[0], wk = fmtDay(n0, { day: 'numeric', month: 'short' }) + ' – ' + fmtDay(n0 + 6, { day: 'numeric', month: 'short' });

  if(!list.length) return t('wa_none', first, wk);
  return t('wa_hi', first, wk) + '\n' + list.map(function(s){ var p = posOf(s.pos); return '• ' + fmtDay(dayNum(s.d)) + ': ' + s.a + '–' + s.b + (p ? ' (' + p.n + ')' : '') + (s.note ? ' – ' + s.note : ''); }).join('\n') + '\n' + t('total') + ': ' + hrs(empMinutes(e.id, list)) + ' ' + t('h');
}

    '<div class="field"><span class="lbl">' + esc(t('s_ws')) + '</span><div class="seg" id="gWs"><button type="button" data-ws="1"' + (s.ws === 1 ? ' class="on"' : '') + '>' + esc(t('mon')) + '</button><button type="button" data-ws="0"' + (s.ws === 0 ? ' class="on"' : '') + '>' + esc(t('sun')) + '</button></div></div>' +
    '<div style="display:grid;gap:8px;margin-top:6px"><button class="btn" id="gRoles" type="button">' + esc(t('s_pos')) + '</button><button class="btn" id="gExp" type="button">' + esc(t('g_export')) + '</button><button class="btn" id="gShare" type="button">' + esc(t('g_share')) + '</button><button class="btn" id="gSync" type="button">' + esc(t('g_sync')) + '</button><button class="btn" id="gSetup" type="button">' + esc(t('g_setup')) + '</button><button class="btn primary" id="gClose" type="button">' + esc(t('close')) + '</button></div>', function(el){
    var ws = s.ws;
    var keep = function(){ var biz = $('#gBiz', el).value.trim(), cur = settings(); if(biz !== cur.biz || ws !== cur.ws){ var keepWeek = numIso(curWeek + 3); touchMany([Object.assign({ id: 'set', k: 'set' }, cur, { biz: biz, ws: ws })]); curWeek = week0(dayNum(keepWeek)); render(); } };
    $('#gWs', el).onclick = function(e){ var b = e.target.closest('[data-ws]'); if(!b) return; ws = +b.dataset.ws; [].forEach.call(el.querySelectorAll('#gWs button'), function(o){ o.classList.toggle('on', o === b); }); };
    $('.lang', el).addEventListener('click', function(e){ if(e.target.closest('[data-lang]')){ setTimeout(function(){ keep(); close(el); $('#gear').click(); }); } });
    var go = function(fn){ return function(){ keep(); close(el); fn(); }; };
    $('#gRoles', el).onclick = go(editRoles);
    $('#gExp', el).onclick = go(exportWin);
    $('#gShare', el).onclick = go(function(){ shareAccess(false); });
    $('#gSync', el).onclick = go(syncNow);
    $('#gSetup', el).onclick = go(function(){ $('#setup').hidden = false; $('#app').hidden = true; $('#sName').value = cfg.name; drawSetup(); setMode('code'); $('#sCode').value = showCode(cfg.code); });
    $('#gClose', el).onclick = go(function(){});
  });
};
var csvLine = function(r){ return r.map(function(v){ v = String(v == null ? '' : v); return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); };
var csvFile = function(rows){ return '﻿' + rows.map(csvLine).join('\r\n') + '\r\n'; };
function exportWin(){
  var d = new Date(), f = iso(new Date(d.getFullYear(), d.getMonth(), 1)), to = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  modal('<h3>' + esc(t('ex_title')) + '</h3><div class="grid2"><div class="field"><label for="xF">' + esc(t('ex_from')) + '</label><input id="xF" type="date" value="' + f + '"></div><div class="field"><label for="xT">' + esc(t('ex_to')) + '</label><input id="xT" type="date" value="' + to + '"></div></div>' +
    '<div style="display:grid;gap:8px"><button class="btn" id="xS" type="button">' + esc(t('ex_shifts')) + '</button><button class="btn" id="xH" type="button">' + esc(t('ex_hours')) + '</button><button class="btn primary" data-close type="button">' + esc(t('close')) + '</button></div>', function(el){
    var range = function(){ var a = $('#xF', el).value, b = $('#xT', el).value; if(a > b){ var s = a; a = b; b = s; } return [a, b]; };
    $('#xS', el).onclick = function(){
      var r = range(), list = live('sh').filter(function(s){ return s.d >= r[0] && s.d <= r[1]; }).sort(function(a, b){ return a.d.localeCompare(b.d) || mins(a.a) - mins(b.a); });
      var rows = [TX[lang].csv_sh].concat(list.map(function(s){ var p = posOf(s.pos); return [s.d, fmtDay(dayNum(s.d), { weekday: 'short' }), s.a, s.b, hrs(dur(s)), p ? p.n : '', s.emp ? empName(s.emp) : t('open'), s.note || '']; }));
      download('turnos-' + r[0] + '_' + r[1] + '.csv', csvFile(rows), 'text/csv');
    };
    $('#xH', el).onclick = function(){
      var r = range(), list = live('sh').filter(function(s){ return s.d >= r[0] && s.d <= r[1] && s.emp; }), ids = {};
      emps().forEach(function(e){ ids[e.id] = 1; }); list.forEach(function(s){ ids[s.emp] = 1; });
      var n0 = dayNum(r[0]), n1 = dayNum(r[1]);
      var rows = [TX[lang].csv_h].concat(Object.keys(ids).map(function(id){
        var mine = list.filter(function(s){ return s.emp === id; }), days = 0;
        live('off').filter(function(o){ return o.emp === id; }).forEach(function(o){ var a = Math.max(n0, dayNum(o.from)), b = Math.min(n1, dayNum(o.to)); if(b >= a) days += b - a + 1; });
        return [empName(id), mine.length, hrs(empMinutes(id, mine)), days];
      }).sort(function(a, b){ return norm(a[0]).localeCompare(norm(b[0])); }));
      download('horas-' + r[0] + '_' + r[1] + '.csv', csvFile(rows), 'text/csv');
    };
  });
}

/* ---------- small windows ---------- */
function modal(html, init){
  var ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  ov.addEventListener('click', function(e){ if(e.target === ov || e.target.closest('[data-close]')) close(ov); });
  $('#layer').appendChild(ov); if(init) init(ov); return ov;
}
function close(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ var o = $('#layer .ov:last-child'); if(o) close(o); } });
var toastT = 0;
function toast(text, act, fn){
  var old = $('.toast'); if(old) close(old);
  var el = document.createElement('div'); el.className = 'toast'; el.innerHTML = '<span>' + esc(text) + '</span>' + (act ? '<button type="button">' + esc(act) + '</button>' : '');
  if(act) el.querySelector('button').onclick = function(){ close(el); fn(); };
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(function(){ close(el); }, 6000);
}

/* ---------- saving to GitHub ---------- */
function touchMany(list){
  if(!list.length) return;
  var now = Date.now();
  list.forEach(function(x){ x.t = now; data[x.id] = x; });
  dirty = true; store.set(KEY.data, data); store.set(KEY.dirty, dirty); render(); syncSoon();
}
function setSync(st, k, arg){ sync.label = [st, k, arg]; var p = $('#sync'); p.className = 'pill ' + st; p.lastChild.textContent = k === '…' ? '…' : t(k, arg); }
$('#sync').addEventListener('click', function(){
  if(!sync.err || !/err|wait/.test(this.className)) return;
  modal('<h3>' + esc(t('err_title')) + '</h3><p style="overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace;font-size:14px">' + esc(sync.err.detail) + '</p>' + (/^PUT 403/.test(sync.err.detail) ? '<div class="msg warn">' + esc(t('err_write')) + '</div>' : '') + '<p class="hint">' + esc(new Date(sync.err.at).toLocaleString(t('locale'))) + ' · navigator.onLine=' + sync.err.online + ' · ' + esc(cfg.repo) + '</p><div class="row2"><button class="btn" data-close type="button">' + esc(t('close')) + '</button><button class="btn primary" id="errRetry" type="button">' + esc(t('err_retry')) + '</button></div>', function(el){ $('#errRetry', el).onclick = function(){ close(el); syncNow(); }; });
});
function syncSoon(){ clearTimeout(sync.timer); setSync('wait', 's_saving'); sync.timer = setTimeout(syncNow, 1200); }
function api(opt){
  opt = opt || {}; opt.headers = Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, opt.headers || {}); opt.cache = 'no-store';
  return fetch('https://api.github.com/repos/' + cfg.repo + '/contents/' + APP.file, opt);
}
/* newer change wins per record */
function merge(remote){
  var changed = false;
  Object.keys(remote || {}).forEach(function(id){
    var r = remote[id], l = data[id];
    if(!r) return;
    if(!l || (r.t || 0) > (l.t || 0)){ data[id] = r; changed = true; }
  });
  return changed;
}
async function httpErr(r, what){
  var m = ''; try{ var j = await r.clone().json(); m = j.message || ''; if(j.errors) m += ' ' + JSON.stringify(j.errors); }catch(e){ try{ m = (await r.text()).slice(0, 200); }catch(x){} }
  var e = new Error('http ' + r.status); e.status = r.status; e.detail = what + ' ' + r.status + (m ? ': ' + m : ''); return e;
}
async function load(){
  var r = await api();
  if(r.status === 404) return { sha: null, c: {} };
  if(!r.ok) throw await httpErr(r, 'GET');
  var j = await r.json(), txt = j.content ? b64d(j.content) : '';
  if(!txt && j.size){ var rr = await api({ headers: { Accept: 'application/vnd.github.raw' } }); if(!rr.ok) throw await httpErr(rr, 'GET raw'); txt = await rr.text(); }
  var o = JSON.parse(txt || '{}');
  return { sha: j.sha, c: o.c || {} };
}
async function save(){
  for(var tries = 0; tries < 3; tries++){
    var cur = await load(); merge(cur.c);
    var body = { message: cfg.name + ' ' + new Date().toISOString(), content: b64e(JSON.stringify({ v: 1, c: data }) + '\n') };
    if(cur.sha) body.sha = cur.sha;
    var r = await api({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if(r.ok) return;
    if(r.status !== 409 && r.status !== 422) throw await httpErr(r, 'PUT');
    sync.lastConflict = await httpErr(r, 'PUT');
  }
  throw sync.lastConflict;
}
async function syncNow(){
  if(!cfg) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; clearTimeout(sync.timer);
  try{
    if(dirty){ dirty = false; store.set(KEY.dirty, dirty); try{ await save(); }catch(e){ dirty = true; store.set(KEY.dirty, dirty); throw e; } }
    else { var cur = await load(); merge(cur.c); }
    store.set(KEY.data, data);
    sync.err = null; setSync('ok', 's_saved', hm(Date.now()));
  }catch(e){
    if(/http 401/.test(e.message)){
      var fresh = null; try{ fresh = await openAccess(cfg.code); }catch(x){}
      if(fresh && fresh.token !== cfg.token){ cfg.token = fresh.token; cfg.repo = fresh.repo; store.set(KEY.cfg, cfg); sync.busy = false; return syncNow(); }
      setSync('err', 's_expired');
    }
    else {
      sync.err = { at: Date.now(), detail: e.detail || (e.name + ': ' + e.message), online: navigator.onLine };
      try{ console.error('[ausblick sync]', sync.err.detail, e); }catch(x){}
      if(e.status) setSync(dirty ? 'wait' : 'err', dirty ? 's_later_err' : 's_error', e.status);
      else setSync(dirty ? 'wait' : 'err', dirty ? 's_later' : 's_offline');
    }
  }
  sync.busy = false;
  /* don't redraw under an open window; it redraws when that window saves */
  if(!$('#layer .ov')) render();
  if(sync.again){ sync.again = false; syncNow(); }
}
setInterval(function(){ if(cfg && document.visibilityState === 'visible') syncNow(); }, 60000);
addEventListener('online', function(){ syncNow(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') syncNow(); });

curWeek = week0(dayNum(todayIso()));
applyLang();
show();
if(cfg){ setSync(dirty ? 'wait' : 'ok', '…'); syncNow(); }
window.__as = { get data(){ return data; }, get cfg(){ return cfg; }, syncNow: syncNow, sealAccess: sealAccess, setLang: setLang, problems: problems };
})();
</script>
